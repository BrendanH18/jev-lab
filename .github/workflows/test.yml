name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel runs on main

jobs:
  test:
    name: Python ${{ matrix.python }} (locked SDK)
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests (no API key needed)
        run: uv run --locked python -m unittest discover -v tests

  lint:
    name: Lint and format
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Ruff (dev group only; the lint needs no SDK)
        run: uv sync --locked --only-group dev
      - name: Lint Python
        run: uv run --locked --only-group dev ruff check
      - name: Check Python formatting
        run: uv run --locked --only-group dev ruff format --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Biome from package-lock.json
        run: npm ci
      - name: Lint and check formatting of JavaScript
        run: npm run lint

  javascript:
    name: JavaScript modules and tests
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check browser modules
        run: |
          for file in $(find static/js -name '*.js' | sort); do
            node --input-type=module --check < "$file" || exit 1
          done
      - name: Test browser modules
        # Some tests compare JS calculations to the Python implementation.
        run: uv run --locked node --test tests/js/*.test.mjs tests/js/lab/*.test.mjs

  samples:
    name: Sample pictures match the script
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Redraw the sample pictures
        run: python3 scripts/draw_samples.py
      - name: Fail if the committed pictures are stale
        run: |
          git add --intent-to-add static/img/samples
          git diff --exit-code --stat static/img/samples

  # The check the main ruleset requires. A job that a failed job `needs` is skipped, and a skipped
  # required check counts as passing, so this runs always() and passes only if every job above passed.
  tests-passed:
    name: All tests passed
    needs: [test, lint, javascript, samples]
    if: always()
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo "Results: $RESULTS"
          test "$(echo "$RESULTS" | tr ' ' '\n' | sort -u)" = success
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
