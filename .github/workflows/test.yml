name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel runs on main

jobs:
  test:
    name: Python ${{ matrix.python }} (locked SDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests (no API key needed)
        run: uv run --locked python -m unittest discover -v tests

  # Its own job: installing Chromium takes longer than the steps of the required job below.
  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install Playwright from package-lock.json
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests (loopback server and model stub, no key)
        run: npx playwright test

  # The check the main ruleset requires. A job that a failed job `needs` is skipped, and a skipped
  # required check counts as passing, so this runs always() and passes only if every job it needs
  # passed. The checks that take seconds (lint, JavaScript, sample pictures) run here as steps rather
  # than on runners of their own.
  tests-passed:
    name: All tests passed
    needs: [test, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      # Each step runs when the steps it needs succeeded, even after an unrelated step failed, so one
      # push reports every failure.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        id: uv
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        id: node
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        with:
          node-version: "22"
          cache: npm
      - name: Install Biome from package-lock.json
        id: biome
        if: ${{ !cancelled() && steps.node.conclusion == 'success' }}
        run: npm ci
      # Ruff installs the dev group only, so a failed SDK install cannot hide the lint.
      - name: Lint Python
        if: ${{ !cancelled() && steps.uv.conclusion == 'success' }}
        run: uv run --locked --only-group dev ruff check
      - name: Check Python formatting
        if: ${{ !cancelled() && steps.uv.conclusion == 'success' }}
        run: uv run --locked --only-group dev ruff format --check
      - name: Lint and check formatting of JavaScript
        if: ${{ !cancelled() && steps.biome.conclusion == 'success' }}
        run: npm run lint
      - name: Check browser modules
        if: ${{ !cancelled() && steps.node.conclusion == 'success' }}
        run: |
          for file in $(find static/js -name '*.js' | sort); do
            node --input-type=module --check < "$file" || exit 1
          done
      - name: Test browser modules
        if: ${{ !cancelled() && steps.node.conclusion == 'success' && steps.uv.conclusion == 'success' }}
        # Some tests compare JS calculations to the Python implementation; uv run installs the locked SDK
        # without the dev group, so a failed Ruff install cannot hide them.
        run: uv run --locked --no-dev node --test tests/js/*.test.mjs tests/js/lab/*.test.mjs
      - name: Redraw the sample pictures
        id: samples
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        run: python3 scripts/draw_samples.py
      - name: Fail if the committed pictures are stale
        if: ${{ !cancelled() && steps.samples.conclusion == 'success' }}
        run: |
          git add --intent-to-add static/img/samples
          git diff --exit-code --stat static/img/samples
      # A cancelled run skips the checks left above, so it must not end green.
      - name: Fail when the run was cancelled
        if: cancelled()
        run: exit 1
      - name: Every job it needs passed
        if: always()
        run: |
          echo "Results: $RESULTS"
          test "$(echo "$RESULTS" | tr ' ' '\n' | sort -u)" = success
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
