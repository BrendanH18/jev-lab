name: audit

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit locked dependencies
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No cache: uv audit reads uv.lock and queries OSV without downloading packages.
      - uses: astral-sh/setup-uv@v7
      - name: Check uv.lock against known vulnerabilities
        run: uv audit --frozen --preview-features audit-command
