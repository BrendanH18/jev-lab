[project]
name = "jev-lab"
version = "0.2.0"
description = "Interactive demos and a local workbench for typed AI decisions with TypeSafe's Jev"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["typesafe", "jev", "system-one", "ai", "demo"]
dependencies = [
  "typesafe-sdk>=0.6.0",
]

[project.urls]
Repository = "https://github.com/BrendanH18/jev-lab"
Documentation = "https://github.com/BrendanH18/jev-lab#readme"
Issues = "https://github.com/BrendanH18/jev-lab/issues"
Releases = "https://github.com/BrendanH18/jev-lab/releases"

# Jev Lab is an application, not a library: `uv run server.py` installs the dependency into a
# project venv and starts the server. No build backend is needed.
[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
